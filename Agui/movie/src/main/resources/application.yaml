spring:
  application:
    name: movie
  datasource:
    url: jdbc:mysql://localhost:3306/umc_movie
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}

springdoc:
  paths-to-match: /auth/login, /favorites, /favorites/**, /movie-records
  override-with-generic-response: false
