$kind: http-request
name: "닉네임 사용 가능"
method: GET
url: '{{base_url}}/members/nickname/%EB%AF%B8%EB%93%B1%EB%A1%9D%EC%95%84%EA%B7%80'
order: 2000
headers:
  - key: Origin
    value: 'http://localhost:5173'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('CORS permits the frontend', () => pm.expect(pm.response.headers.get('Access-Control-Allow-Origin')).to.eql('http://localhost:5173'));
      pm.test('Available nickname', () => pm.expect(pm.response.json()).to.eql({available:true}));
