name: movielog
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17 # SVG 로고 및 아이콘 표시용 패키지
  go_router: ^18.0.2
  flutter_rating_bar: ^4.0.1
  dio: ^5.8.0 # TMDB HTTP 통신
  provider: ^6.1.2 # ViewModel 상태 관리
  flutter_dotenv: ^5.2.1 # TMDB Token을 .env로 관리

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 에셋 폴더 등록 (마지막에 슬래시 / 포함)
  assets:
    - .env # TMDB 환경변수 (Git에는 커밋하지 않음, .env.example 참고)
    - assets/images/
    - assets/images/profile/
    - assets/images/posters/
    - assets/icons/
    - assets/logos/

  # 폰트 등록
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
